# 出題するグループとメンバーの定義
#
# 確認日: 2026-11-18(Wikidata の「メンバー」(P527)と「Commons カテゴリ」(P373)をもとに作成)
#
# フィールド
#   id               英小文字・数字のみ。カードのIDは「<グループid>-<メンバーid>」になる(例: twice-nayeon)
#                    手動で画像を置くときのフォルダ: raw/<グループid>/<メンバーid>/*.jpg
#                    書き出し先:               public/cards/<グループid>-<メンバーid>/
#   name             表示名(ja / en / ko)。ゲームの画面では ja を表示し、en を小さく添える
#   real_name        本名のローマ字表記。Commons のカテゴリで足りないときの検索キーワードに使う
#   wikidata         Wikidata の項目ID(人物を確認するため)
#   commons_category Wikimedia Commons のカテゴリ名(先頭の "Category:" は付けない)
#   status           active(現メンバー)/ former(元メンバー)
#   enabled          false にすると、画像処理もゲームでの出題もしない(省略時は true)

